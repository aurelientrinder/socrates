name: Start a release

# One click from the Actions tab: tags main at package.json's version and
# runs "Desktop release" on that tag, which builds a DRAFT release. Nothing
# reaches the app until the draft is published, by hand or, with the
# "publish" input, automatically once the draft passes verification.
# (Tags pushed with GITHUB_TOKEN don't trigger workflows, so this dispatches
# the release run explicitly.)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release automatically once it is verified"
        type: boolean
        default: false
      retag:
        description: "Move an existing tag to main (only while its release is still unpublished)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Tag and start the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Create the version tag and dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          RETAG: ${{ inputs.retag }}
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            if [ "$RETAG" != "true" ]; then
              echo "::error::$tag already exists; bump package.json's version first."
              exit 1
            fi
            # Installed apps update from published releases only, so a tag whose
            # release was never published can still be moved to a newer main.
            if gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              --jq ".[] | select(.tag_name == \"$tag\" and .draft == false) | .id" | grep -q .; then
              echo "::error::$tag is already published; bump package.json's version instead."
              exit 1
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          gh workflow run release.yml --ref "$tag" -f publish="$PUBLISH"
          echo "Started Desktop release on $tag"
